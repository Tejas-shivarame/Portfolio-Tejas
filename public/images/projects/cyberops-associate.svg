<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="100%" stop-color="#1D4ED8"/>
  </linearGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#22C55E"/>
    <stop offset="100%" stop-color="#15803D"/>
  </linearGradient>
  <filter id="shadow">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#00000055"/>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
</defs>

<rect width="800" height="500" rx="28" fill="url(#bg)"/>

<circle cx="120" cy="100" r="90" fill="#3B82F633" filter="url(#blur)"/>
<circle cx="680" cy="400" r="90" fill="#22C55E33" filter="url(#blur)"/>

<g filter="url(#shadow)">
  <rect x="180" y="70" width="440" height="360" rx="30" fill="#111827" stroke="#334155"/>
</g>

<path d="M400 110 L500 150 V235 C500 310 455 368 400 400 C345 368 300 310 300 235 V150 Z"
      fill="url(#shield)"/>

<polygon points="400,175 455,205 455,265 400,295 345,265 345,205"
         fill="none" stroke="white" stroke-width="5"/>

<text x="400" y="225" text-anchor="middle"
      font-family="Arial,Helvetica,sans-serif"
      font-size="24" font-weight="700" fill="white">CyberOps</text>

<text x="400" y="255" text-anchor="middle"
      font-family="Arial,Helvetica,sans-serif"
      font-size="18" font-weight="600" fill="#DBEAFE">Associate</text>

<line x1="360" y1="272" x2="440" y2="272" stroke="white" opacity=".6"/>

<text x="400" y="455" text-anchor="middle"
      font-family="Arial,Helvetica,sans-serif"
      font-size="30" font-weight="700" fill="white">
Cisco Networking Academy
</text>
</svg>